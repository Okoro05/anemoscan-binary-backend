name: CI

on:
  push:
    branches: [main, binary-split]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
